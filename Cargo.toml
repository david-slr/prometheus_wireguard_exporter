[package]
name                     = "prometheus_wireguard_exporter"
version                  = "3.6.6"
authors                  = ["Francesco Cogno <francesco.cogno@outlook.com>"]
description              = "Prometheus WireGuard Exporter"
edition                  = "2018"

readme                   = "README.md"
license                  = "MIT"
repository               = "https://github.com/MindFlavor/prometheus_wireguard_exporter"
documentation            = "https://github.com/MindFlavor/prometheus_wireguard_exporter"
homepage                 = "https://github.com/MindFlavor/prometheus_wireguard_exporter"

keywords                 = ["prometheus", "exporter", "wireguard"]
categories               = ["database"]

[features]
default 		 = []
leaky_log     		 = []

[dependencies]
log                      = "0.4.33"
env_logger               = "0.11.11"
clap                     = { version = "4.6.6", features = ["cargo", "env"] }
serde_json               = "1.0.151"
serde                    = "1.0.229"
thiserror		 = "2.0.20"
anyhow			 = "1.0.104"
hyper                    = { version = "0.14.32", features = ["stream"] }
http                     = "0.2.12"
tokio                    = { version = "1.53.1", features = ["macros", "rt"] }
prometheus_exporter_base = { version = "1.4.0", features = ["hyper_server"] }
regex                    = "1.13.1"

[dev-dependencies]
clippy = "0.0.302"
