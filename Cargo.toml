[package]
name = "prometheus_wireguard_exporter"
version = "3.6.6"
authors = ["Francesco Cogno <francesco.cogno@outlook.com>"]
description = "Prometheus WireGuard Exporter"
edition = "2024"

documentation = "https://github.com/MindFlavor/prometheus_wireguard_exporter"
readme = "README.md"
homepage = "https://github.com/MindFlavor/prometheus_wireguard_exporter"
repository = "https://github.com/MindFlavor/prometheus_wireguard_exporter"
license = "MIT"

keywords = ["exporter", "prometheus", "wireguard"]
categories = ["database"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["cargo", "env"] }
env_logger = "0.11.11"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "tokio"] }
log = "0.4.33"
num = "0.4.3"
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync"] }

[features]
default = []
leaky_log = []
